name: Test RapidYAML Plugin

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v5
    - name: Test plugin and conformance
      run: make test test-conformance fuzz test-goyaml test-goyaml-race
    - name: Check release preview
      run: |
        version=$(perl -ne 'print "$1" if /:version "([^\"]+)"/' plugin.edn)
        make release v="$version" d=1
    - name: Check out go-yaml host
      uses: actions/checkout@v5
      with:
        repository: yaml/go-yaml
        ref: 32734c39dedb70116a90a5d59e26580a3e7bf71f
        path: repos/go-yaml
    - name: Test generic go-yaml CLI build
      env:
        GO_YAML_DIR: repos/go-yaml
      run: make test-goyaml-cli
    - name: Install macOS archive dependencies
      if: runner.os == 'macOS'
      run: |
        brew list gnu-tar >/dev/null 2>&1 || brew install gnu-tar
        brew list xz >/dev/null 2>&1 || brew install xz
    - name: Build wheel
      run: make wheel test-wheel
    - name: Check out YAMLStar host
      uses: actions/checkout@v5
      with:
        repository: yaml/yamlstar
        ref: ${{ vars.YAMLSTAR_REF || '28f8d7b77ce3ae12d3b91cecc46c4f0b15d77b61' }}
        path: repos/yamlstar
    - name: Build YAMLStar
      run: make -C repos/yamlstar cli build-libyamlstar
    - name: Test CLI
      run: |
        YAMLSTAR_TEST_PLUGIN="$PWD/lib" \
          make -C repos/yamlstar test-unit test=test/shared-parser.t
    - name: Test Python wheel discovery
      run: |
        PYTHONPATH="$PWD/repos/yamlstar/python/lib" \
          YAMLSTAR_TEST_SUITE_DIR="$PWD/.cache/yaml-test-suite" \
          .cache/wheel-test/bin/python python/test_integration.py
